services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: study
      DB_PASSWORD: study123
      DB_NAME: studyboard
      PORT: 4000
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  database:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: studyboard
      MYSQL_USER: study
      MYSQL_PASSWORD: study123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
    name: studyboard-docker-dummy
